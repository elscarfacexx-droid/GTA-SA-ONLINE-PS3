name: PS3 PPU Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Download PS3 toolchain
        run: |
          curl -fL --retry 3 \
            "https://github.com/ps3dev/ps3toolchain/releases/download/nightly-2026-10-11/ps3dev-linux-X64.tar.gz" \
            -o "$RUNNER_TEMP/ps3dev.tar.gz"

      - name: Extract toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/ps3dev"
          tar -xzf "$RUNNER_TEMP/ps3dev.tar.gz" -C "$RUNNER_TEMP/ps3dev"

      - name: Inspect PSL1GHT repository
        run: |
          git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git "$RUNNER_TEMP/PSL1GHT"
          echo "PSL1GHT baixado."
          ls "$RUNNER_TEMP/PSL1GHT"
