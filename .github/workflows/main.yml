name: PS3 PPU Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check source code
        run: |
          echo "Verificando codigo C"
          test -f client/ps3/client.c
          cat client/ps3/client.c

      - name: Check PPU compiler
        run: |
          if command -v ppu-gcc >/dev/null 2>&1; then
            ppu-gcc --version
          else
            echo "PPU-GCC ainda nao esta instalado."
            exit 1
          fi
