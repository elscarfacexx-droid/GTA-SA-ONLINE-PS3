      - name: Verify SDK and compile test
        run: |
          echo "Verificando PPU-GCC:"
          ppu-gcc --version

          echo "Verificando PSL1GHT:"
          test -d "$PSL1GHT/ppu"

          echo "Compilando programa de teste:"
          cat > "$RUNNER_TEMP/test.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
              printf("GTA SA ONLINE PS3\n");
              return 0;
          }
          EOF

          ppu-gcc "$RUNNER_TEMP/test.c" -o "$RUNNER_TEMP/test.elf"
          file "$RUNNER_TEMP/test.elf"
